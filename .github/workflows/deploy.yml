name: Build, Evaluate & Deploy to AWS EC2

on:
  push:
    branches: [policy-agent-v4, policy-agent-v3, master, main]

env:
  ECR_REPO: policy-agent

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Fast Lint & Unit Tests
  # ──────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Run unit tests
        env:
          OPENAI_API_KEY: "dummy-key"
          DEEPSEEK_API_KEY: "dummy-key"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          POSTGRES_URI: "postgresql://dummy:dummy@localhost:5432/dummy"
          REDIS_URL: "redis://localhost:6379"
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────
  # Job 2: Build Once -> Eval Exact Image -> Push to ECR (PASS ONLY)
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build, Evaluate & Push Golden Image
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Prune previous Docker cache
        run: docker system prune -af --volumes || true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Set image metadata
        id: meta
        run: |
          TAG=${GITHUB_SHA::7}
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: 1. Build Docker Image (Built ONCE)
        run: |
          URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}
          TAG=${{ steps.meta.outputs.image_tag }}
          docker build -t $URI:$TAG -t $URI:latest .

      - name: 2. Evaluate Exact Built Image (Quality Gate)
        run: |
          URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}
          TAG=${{ steps.meta.outputs.image_tag }}
          docker run --rm \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            -e CLAUDE_API_KEY="${{ secrets.CLAUDE_API_KEY }}" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e POSTGRES_URI="${{ secrets.POSTGRES_URI }}" \
            -e EVAL_ROUTER_MIN_ACCURACY=90.0 \
            -e EVAL_TOOL_MIN_ACCURACY=85.0 \
            -e EVAL_RAG_MIN_GROUNDEDNESS=3.8 \
            -e EVAL_RAG_MIN_RELEVANCE=3.8 \
            $URI:$TAG python eval/run_evals.py

      - name: 3. Push to ECR (PASS ONLY)
        run: |
          URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}
          TAG=${{ steps.meta.outputs.image_tag }}
          docker push $URI:$TAG
          docker push $URI:latest

      - name: Cleanup runner Docker image cache
        if: always()
        run: docker system prune -af --volumes || true

  # ──────────────────────────────────────────────
  # Job 3: Deploy to Staging & Smoke Tests
  # ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy & Smoke Test Staging
    needs: [build-and-push]
    if: github.ref == 'refs/heads/policy-agent-v4' || github.ref == 'refs/heads/policy-agent-v3' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_STAGING_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Login to ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ needs.build-and-push.outputs.image_tag }}

            # Stop old container and clean up disk
            docker stop policy-agent 2>/dev/null || true
            docker rm policy-agent 2>/dev/null || true
            docker system prune -af --volumes

            # Pull and run new image
            docker pull $IMAGE
            docker run -d \
              --name policy-agent \
              --restart unless-stopped \
              --env-file /opt/policy-agent/.env \
              -p 8000:8000 \
              $IMAGE

            # Wait for app to boot (DB connections, LLM init, etc.)
            echo "Waiting 30s for app to start..."
            sleep 30

            # Health check with retries
            echo "Running health checks..."
            for i in $(seq 1 15); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Staging /health is healthy!"
                break
              fi
              echo "  Attempt $i/15..."
              sleep 10
            done

            # Smoke test: Chat endpoint ping
            echo "Running Smoke Test on chat endpoint..."
            SMOKE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/chat \
              -H "Content-Type: application/json" \
              -d '{"message": "Hello"}' || true)

            if [ "$SMOKE_STATUS" -eq 200 ]; then
              echo "✅ Staging smoke test passed (HTTP 200)!"
              exit 0
            else
              echo "⚠️ Health ok but chat endpoint returned HTTP $SMOKE_STATUS"
              exit 0
            fi

  # ──────────────────────────────────────────────
  # Job 4: Deploy to Production (Manual Approval Gate)
  # ──────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging, build-and-push]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Login to ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ needs.build-and-push.outputs.image_tag }}

            # Stop old container and clean up disk
            docker stop policy-agent 2>/dev/null || true
            docker rm policy-agent 2>/dev/null || true
            docker system prune -af --volumes

            # Pull and run new image
            docker pull $IMAGE
            docker run -d \
              --name policy-agent \
              --restart unless-stopped \
              --env-file /opt/policy-agent/.env \
              -p 8000:8000 \
              $IMAGE

            # Wait for app to boot (DB connections, LLM init, etc.)
            echo "Waiting 30s for app to start..."
            sleep 30

            # Health check with retries
            echo "Running health checks..."
            for i in $(seq 1 15); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Production is healthy!"
                exit 0
              fi
              echo "  Attempt $i/15..."
              sleep 10
            done
            echo "❌ Production health check failed"
            docker logs policy-agent --tail 50
            exit 1
